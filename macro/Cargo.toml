[package]
name = "safegraph-macros"
version = "0.3.1"
edition = "2021"
rust-version = "1.56"
authors = ["yasuo-ozu <yasuo@ozu.email>"]
description = "Procedural `graph!` builder macro for the safegraph graph library."
documentation = "https://docs.rs/safegraph-macros"
homepage = "https://github.com/yasuo-ozu/safegraph"
repository = "https://github.com/yasuo-ozu/safegraph"
license = "MIT"
keywords = ["graph", "macro", "proc-macro"]
categories = ["data-structures"]

[lib]
proc-macro = true
path = "lib.rs"

[dependencies]
# Only the parsing machinery: `{expr}` payloads and the statement-mode graph
# expression are passed through as tokens, so no `full`/`derive` syntax tree.
syn = { version = "2", default-features = false, features = ["parsing", "proc-macro"] }
template-quote = "0.5"
proc-macro2 = "1"
# Without its default `syn-error` feature, which only converts `syn` 1 errors
# and would pull in all of `syn` 1.
proc-macro-error = { version = "1", default-features = false }
