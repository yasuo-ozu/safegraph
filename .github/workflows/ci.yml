name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Verify the core crate still builds on the declared MSRV (rust-version in
  # Cargo.toml). The default `matrix` backend (sprs/ndarray) and the dev-deps
  # require a newer rustc, so the MSRV covers `--no-default-features`.
  #
  # The division of labour below is deliberate: modern cargo does ALL network and
  # resolution work, and 1.56 only compiles. Two reasons —
  #  * dev-deps must be dropped before 1.56 sees the manifest. They stay in the
  #    resolve graph even though `check` never builds them, and cargo 1.56 cannot
  #    parse modern manifests (e.g. `bstr` uses `dep:` namespaced features, which
  #    need cargo 1.60), so it fails before compiling anything.
  #  * 1.56 predates sparse-registry support (added 1.68, default 1.70), so left
  #    to itself it clones the ~2GB legacy *git* crates.io index — measured at
  #    6m44s of a 6m46s step, against 0.6s for the same resolve on stable.
  #    Vendoring with stable and running 1.56 `--offline` skips that entirely.
  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.56.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check core crate on MSRV (1.56)
        run: |
          rustc +1.56.0 --version   # make the toolchain under test visible in the log
          sed -i '/^\[dev-dependencies\]/,$d' Cargo.toml
          cargo +stable generate-lockfile
          # `fallback` above only honours a *declared* `rust-version`, and
          # `unicode-width` declares none anywhere in its 0.1 line — yet 0.1.13
          # derives `Default` on an enum (1.62) and 0.1.14 calls
          # `usize::wrapping_add_signed` (1.66). 0.1.12 is the newest 1.56-clean
          # release and exposes the same `width()` API, so pin it here.
          cargo +stable update -p unicode-width --precise 0.1.12
          # Vendor with stable, then compile offline on 1.56 (see job comment).
          mkdir -p .cargo
          cargo +stable vendor --versioned-dirs vendor > .cargo/config.toml
          cargo +1.56.0 check --release --no-default-features --locked --offline

  # PINNED, not floating `stable`. `tests/ui.rs` is part of the default `cargo
  # test` set, and its `.stderr` snapshots compare rustc's diagnostic output
  # verbatim — output that drifts between compiler releases (wording, extra
  # `help:` suggestions), so a floating toolchain would fail on changes that say
  # nothing about this crate. To bump: install the new toolchain, re-bless with
  # `BLESS=1 cargo +<ver> test --test ui`, and update the version here.
  test:
    name: Test (pinned rustc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo test

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # PINNED for the same reason as `test`: `-D warnings` turns every lint added in
  # a new clippy release into a build failure, so a floating toolchain breaks CI
  # on lints that did not exist when the code was written. Bump deliberately.
  clippy:
    name: Clippy (pinned rustc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build docs (warnings are errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Doc tests (warnings are errors)
        run: cargo test --doc
        env:
          RUSTDOCFLAGS: -D warnings
